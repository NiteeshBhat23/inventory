<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on
         notched phones; without it the bottom nav sits under the gesture bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Track purchase cost, stock, and margin for your service centre." />
    <!-- Two theme-colors so the browser chrome matches the active theme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Warm the TLS connection to the API before the bundle has even parsed,
         so the first dashboard request doesn't pay DNS + TCP + TLS itself. -->
    <link rel="preconnect" href="%VITE_API_ORIGIN%" crossorigin />

    <!-- Fonts load without blocking first paint: the browser fetches the
         stylesheet as a non-blocking preload, then flips it to a real
         stylesheet on load. `display=swap` means text is visible in the
         fallback face throughout rather than invisible while fonts download. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>ProfitPulse</title>

    <!-- Resolve the theme before first paint. Without this, a dark-mode user
         sees a white flash while the JS bundle loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var pref = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
